# Étape 3 — e2 + MixUp/CutMix + sampler équilibré
name: m1-e3-mix
model:
  name: model1
  params: {dropout: 0.3}
data:
  img_size: 128
  augment: strong
  crop: true
train:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  class_weights: false     # NOUVEAU : remplacé par le sampler (sinon double correction)
  sampler: balanced        # NOUVEAU : chaque batch contient autant de chaque classe
  mixup: {alpha: 0.4, cutmix_prob: 0.5, prob: 0.8}   # NOUVEAU
  label_smoothing: 0.1
  select_metric: f1_macro
  patience: 8
  min_epochs: 15           # pas d'early stopping avant la fin de la montée du LR (epoch 9) + marge
seed: 42
