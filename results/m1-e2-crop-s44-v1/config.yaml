name: m1-e2-crop
model:
  name: model1
  params:
    dropout: 0.3
data:
  img_size: 128
  augment: strong
  crop: true
train:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  class_weights: true
  label_smoothing: 0.1
  select_metric: f1_macro
  patience: 8
  min_epochs: 15
seed: 44
